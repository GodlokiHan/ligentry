name: Windows Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test-windows:
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
      MPLBACKEND: Agg
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install scientific, GUI, and package dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install setuptools wheel numpy scipy matplotlib PySide6 requests psutil onnxruntime rdkit
          pip install --no-build-isolation --no-deps -e .

      - name: Run core PK/PD and help tests
        shell: pwsh
        run: |
          python scripts/test_pkpd.py
          python scripts/test_twocomp.py
          python scripts/test_effect.py
          python scripts/test_effect_compartment.py
          python scripts/test_observations.py
          python scripts/test_residuals.py
          python scripts/test_effect_residuals.py
          python scripts/test_pkpd_workflow.py
          python scripts/test_joint_fit.py
          python scripts/test_infusion_tlag.py
          python scripts/test_help.py

      - name: Run job, runio, and offscreen GUI tests
        shell: pwsh
        run: |
          python scripts/test_runio.py
          python scripts/test_job.py
          python scripts/test_help_gui.py
          python scripts/test_pkpd_window.py
          python scripts/test_pkpd_window_delayed.py

      - name: Run stereo and ONNX/model manager checks
        shell: pwsh
        run: |
          python scripts/test_stereo.py
          python -c "import onnxruntime as ort; from ligentry.core.model_manager import get_model_status, user_models_dir; print('ORT:', ort.__version__, ort.get_available_providers()); st = get_model_status(); print('Dir:', user_models_dir(), 'Tier:', st.active_tier, 'Model:', st.model_path)"
