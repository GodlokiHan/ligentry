name: Windows Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-windows:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install core scientific dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install numpy scipy

      - name: Run PK/PD and help tests
        shell: pwsh
        run: |
          python scripts/test_pkpd.py
          python scripts/test_twocomp.py
          python scripts/test_effect.py
          python scripts/test_effect_compartment.py
          python scripts/test_observations.py
          python scripts/test_residuals.py
          python scripts/test_effect_residuals.py
          python scripts/test_pkpd_workflow.py
          python scripts/test_joint_fit.py
          python scripts/test_infusion_tlag.py
          python scripts/test_help.py
