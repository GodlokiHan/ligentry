[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ligentry"
version = "0.1.0"
description = "Open-source platform for drug design and biomolecular simulation workflows"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
dependencies = ["requests"]

[project.optional-dependencies]
gui = [
    "PySide6==6.12.0",
    "vtk==9.7.1",
    "pyvista==0.49.2",
    "pyvistaqt==0.13.1",
    "psutil",
]

[project.scripts]
ligentry = "ligentry.cli:main"

[project.gui-scripts]
ligentry-gui = "ligentry.gui.launcher:main"

[tool.setuptools.packages.find]
include = ["ligentry*"]
